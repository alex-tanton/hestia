name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on GitHub-hosted runners. The self-hosted runner only ever runs deploy.yml.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      # Applies supabase/migrations/ to a fresh local stack, the database the tests run against.
      - name: Start Supabase
        run: supabase start
      # Runs unit and integration tests together with coverage, enforcing
      # apps/service/vitest.coverage.config.ts's thresholds, rather than a separate job that would
      # pay for its own `supabase start`.
      - run: pnpm --filter @hearth/service test:coverage

  test-e2e:
    # E2E is the slow job: pull requests and main only, not every branch push. Most of the time
    # is the two image builds, which a GitHub-hosted runner does from cold on every run.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      # The `secrets` context cannot be read in a step `if:`, so the job env carries the name.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite's own stack is the Compose stack, so migrations are applied with the CLI the
      # way a deploy applies them, and seeding needs psql (both preinstalled on the runner).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: pnpm --filter @hearth/e2e exec playwright install --with-deps chromium
      # GHCR pulls run as this run's own read-only token instead of anonymously. The images are
      # public, so anonymous pulls work too: a failed login must not fail the job before the
      # script's public.ecr.aws fallback can run.
      - name: Log in to ghcr.io
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Authenticated Docker Hub pulls get a higher rate limit. This runs only when the owner has
      # set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets (a read-only token); forks
      # and Dependabot runs do not receive them and skip it. Anonymous pulls still work, so a failed
      # login must not fail the job before the pre-pull's own retries can run.
      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Anonymous pulls from public.ecr.aws are rate limited per IP and hosted runners share IPs,
      # so `docker compose up` could fail with toomanyrequests before any test ran. The script
      # pre-pulls the stack's images so Compose finds them locally. The three Supabase images come
      # from their ghcr.io/supabase mirror (same publisher, same digests) and are tagged with the
      # public.ecr.aws names Compose uses, falling back to public.ecr.aws. The rest come from Docker
      # Hub. Each image gets up to six attempts with growing backoff. The list is read from the
      # Compose file and Dockerfiles, so Dependabot bumps need no edit here, and it includes the
      # BuildKit `# syntax=` frontend. The logins above make the pulls authenticated where possible.
      - run: bash scripts/ci-prepull-images.sh
      # Exactly the local command: Playwright's global setup builds and starts the stack from an
      # empty database, and its teardown drops it (Engineering Practices, "E2E environment").
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
