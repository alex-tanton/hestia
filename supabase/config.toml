# Supabase CLI configuration for local development and CI (`supabase start`), which run
# Postgres, GoTrue, Realtime, Kong, and Studio.
# Production runs docker/docker-compose.yml instead, on the same Postgres, GoTrue, and Realtime
# images. Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "hearth"

[api]
# No PostgREST: the service is the only HTTP path to the data. Kong still serves auth and
# realtime on this port.
enabled = false
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Hearth sends no email while magic link is disabled.
[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

# Mirrors the production GoTrue settings.
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
