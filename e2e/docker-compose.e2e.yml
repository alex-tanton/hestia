# E2E test overlay for docker/docker-compose.yml

services:
  inbucket:
    image: inbucket/inbucket:3.1.0
    restart: unless-stopped
    networks: [hestia]
    ports:
      - 127.0.0.1:${HESTIA_E2E_INBUCKET_PORT:?}:9000

  auth:
    depends_on:
      db:
        condition: service_healthy
      inbucket:
        condition: service_healthy
    environment:
      GOTRUE_SMTP_HOST: inbucket
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_USER: ''
      GOTRUE_SMTP_PASS: ''
      GOTRUE_SMTP_ADMIN_EMAIL: auth@aberrance.app
      GOTRUE_SMTP_SENDER_NAME: Hestia
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://caddy:8080/templates/magic_link.html

  db:
    ports:
      - 127.0.0.1:${HESTIA_E2E_DB_PORT:?}:5432

  hestia-service:
    volumes:
      - ../e2e/fixtures/flipp/raw:/app/fixtures/flipp/raw:ro
      - ../e2e/fixtures/recipes:/app/fixtures/recipes:ro
    environment:
      HESTIA_TRUSTED_PROXIES: ${HESTIA_E2E_SUBNET:?}
      HESTIA_RATE_LIMIT_PER_MINUTE: 3000
      LOG_LEVEL: info
      HESTIA_FLIPP_FIXTURE_DIR: /app/fixtures/flipp/raw
      HESTIA_FLIPP_FIXTURE_NOW: '2026-09-19T06:38:27.000Z'
      HESTIA_RECIPE_FIXTURE_DIR: /app/fixtures/recipes
      HESTIA_PUSH_TRANSPORT: test-double

  kong:
    environment:
      KONG_TRUSTED_IPS: ${HESTIA_E2E_SUBNET:?}

  cloudflared:
    profiles: [e2e-excluded]

  caddy:
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    environment:
      HESTIA_HOST: 127.0.0.1:${HESTIA_E2E_CADDY_PORT:?}
      HESTIA_TRUSTED_PROXIES: ${HESTIA_E2E_SUBNET:?}
    ports:
      - 127.0.0.1:${HESTIA_E2E_CADDY_PORT:?}:8080

networks:
  hestia:
    name: ${HESTIA_E2E_NETWORK:?}
    external: true
    ipam: !reset null
