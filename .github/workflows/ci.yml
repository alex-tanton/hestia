name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on GitHub-hosted runners. The self-hosted runner only ever runs deploy.yml.
#
# Every job has a timeout, so a hung step fails in minutes instead of holding a runner for the
# six-hour default. Each is about two to three times the p95 of the 40 most recent runs (324 job
# records, 2026-10-13 to 2026-10-22), with a floor of 10 minutes; hygiene is new and has no history.
# No job fetches or pushes after checkout, so every checkout drops its token with
# `persist-credentials: false` instead of leaving it in .git/config for the rest of the job.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm -r --filter '!@hestia/web' test
      - run: pnpm --filter @hestia/web test:coverage

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      # Applies supabase/migrations/ to a fresh local stack, the database the tests run against.
      - name: Start Supabase
        run: supabase start
      # Runs before any test, so the database holds only the migrated schema: a hand edit of
      # types.ts, or a migration without regenerated types, fails here.
      - name: db:types matches the migrated schema
        run: |
          pnpm db:types
          git diff --exit-code -- apps/service/src/db/types.ts
      # Runs unit and integration tests together with coverage, enforcing
      # apps/service/vitest.coverage.config.ts's thresholds, rather than a separate job that would
      # pay for its own `supabase start`.
      - run: pnpm --filter @hestia/service test:coverage

  test-e2e:
    # E2E is the slow job: pull requests and main only, not every branch push. Most of the time
    # is the two image builds, which a GitHub-hosted runner does from cold on every run.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      # The `secrets` context cannot be read in a step `if:`, so the job env carries the name.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The suite's own stack is the Compose stack, so migrations are applied with the CLI the
      # way a deploy applies them, and seeding needs psql (both preinstalled on the runner).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: pnpm --filter @hestia/e2e exec playwright install --with-deps chromium
      # GHCR pulls run as this run's own read-only token instead of anonymously. The images are
      # public, so anonymous pulls work too: a failed login must not fail the job before the
      # script's public.ecr.aws fallback can run.
      - name: Log in to ghcr.io
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Authenticated Docker Hub pulls get a higher rate limit. This runs only when the owner has
      # set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets (a read-only token); forks
      # and Dependabot runs do not receive them and skip it. Anonymous pulls still work, so a failed
      # login must not fail the job before the pre-pull's own retries can run.
      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Anonymous pulls from public.ecr.aws are rate limited per IP and hosted runners share IPs,
      # so `docker compose up` could fail with toomanyrequests before any test ran. The script
      # pre-pulls the stack's images so Compose finds them locally. The three Supabase images come
      # from their ghcr.io/supabase mirror (same publisher, same digests) and are tagged with the
      # public.ecr.aws names Compose uses, falling back to public.ecr.aws. The rest come from Docker
      # Hub. Each image gets up to six attempts with growing backoff. The list is read from the
      # Compose file and Dockerfiles, so Dependabot bumps need no edit here, and it includes the
      # BuildKit `# syntax=` frontend. The logins above make the pulls authenticated where possible.
      - run: bash scripts/ci-prepull-images.sh
      # Exactly the local command: Playwright's global setup builds and starts the stack from an
      # empty database, and its teardown drops it.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build

  # The repository gates that keep what the cleanup removed from coming back: unused code and
  # dependencies (knip, and the production-mode baseline), duplication over 2% (jscpd), a production
  # dependency with a known advisory, generated or oddly moded files, and edits to applied
  # migrations. Each step runs even when an earlier one failed, so one run shows every finding
  # instead of the first. The audit reads today's advisory database and its allowances expire by
  # date, so an unchanged tree can turn red; a red run on main holds back the deploy until the
  # dependency is fixed or the advisory is allowlisted in scripts/audit-allowlist.json.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The migration check diffs against the pull request's base or the previous push tip, so it
      # needs history; nothing after checkout fetches or pushes, so the token is not kept.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - name: 'knip: no unused files, exports or dependencies'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm knip
      - name: 'knip --production: no finding outside the baseline'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-knip-baseline.mjs
      - name: 'jscpd: duplication at most 2%'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm jscpd
      - name: 'pnpm audit --prod: no advisory outside the allowlist'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/audit-prod.mjs
      - name: 'Repository hygiene: ignored files, script modes, line endings'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-repo-hygiene.mjs
      # The base arrives through env, never inside the script text, because a pull request
      # controls its own refs and a value spliced into `run` would be executed as shell.
      - name: Migrations are append-only
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-migrations-append-only.mjs --base "$BASE_SHA"
