<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Your sign-in link</title>
  </head>
  <body
    style="
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #1c1917;
      padding: 24px;
    "
  >
    <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 16px">Sign in to Hestia</h2>
    <p style="margin-bottom: 24px">
      Follow the link below to sign in on this device. This link expires in 15 minutes and can only
      be used once.
    </p>
    <p style="margin-bottom: 32px">
      <a
        href="{{ .ConfirmationURL }}"
        style="
          display: inline-block;
          background-color: #2563eb;
          color: #ffffff;
          padding: 12px 24px;
          text-decoration: none;
          border-radius: 6px;
          font-weight: 600;
        "
        >Sign in to Hestia</a
      >
    </p>
    <p style="margin-bottom: 8px; color: #78716c">
      Or enter this 6-digit code on your sign-in screen:
    </p>
    <p
      style="
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.25em;
        margin-bottom: 24px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      "
    >
      {{ .Token }}
    </p>
    <p style="font-size: 13px; color: #a8a29e">
      If you did not request this email, you can safely ignore it.
    </p>
  </body>
</html>
