name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on GitHub-hosted runners. The self-hosted runner only ever runs deploy.yml.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      # Applies supabase/migrations/ to a fresh local stack, the database the tests run against.
      - name: Start Supabase
        run: supabase start
      # Runs unit and integration tests together with coverage, enforcing
      # apps/service/vitest.coverage.config.ts's thresholds, rather than a separate job that would
      # pay for its own `supabase start`.
      - run: pnpm --filter @hearth/service test:coverage

  test-e2e:
    # E2E is the slow job: pull requests and main only, not every branch push. Most of the time
    # is the two image builds, which a GitHub-hosted runner does from cold on every run.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite's own stack is the Compose stack, so migrations are applied with the CLI the
      # way a deploy applies them, and seeding needs psql (both preinstalled on the runner).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: pnpm --filter @hearth/e2e exec playwright install --with-deps chromium
      # Anonymous pulls from public.ecr.aws are rate limited per IP and hosted runners share IPs,
      # so `docker compose up` can fail with toomanyrequests before any test runs. Pre-pull the
      # images the stack needs with backoff so Compose finds them in the local cache. The list is
      # read from the Compose file and Dockerfiles so Dependabot bumps need no edit here. The
      # Dockerfile frontend (# syntax=) is pulled by BuildKit during --build, so it is included.
      - run: |
          set -euo pipefail
          images=$(
            {
              sed -nE 's/^[[:space:]]*image:[[:space:]]*//p' docker/docker-compose.yml |
                { grep -vE '^hearth-|^prodrigestivill/' || true; }
              sed -nE 's/^FROM[[:space:]]+(--[^[:space:]]+[[:space:]]+)*([^[:space:]]+).*/\2/p' docker/*.Dockerfile |
                { grep -E '[:/]' || true; }
              grep -h '^# syntax=' docker/*.Dockerfile | sed 's/^# syntax=//' || true
            } | sort -u
          )
          echo "Pre-pulling images:"
          echo "$images"
          for image in $images; do
            for attempt in 1 2 3 4 5 6; do
              if docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"; then
                continue 2
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "::error::Could not pull $image after $attempt attempts"
                exit 1
              fi
              delay=$((attempt * 30))
              echo "Pull of $image failed (attempt $attempt of 6); retrying in ${delay}s"
              sleep "$delay"
            done
          done
      # Exactly the local command: Playwright's global setup builds and starts the stack from an
      # empty database, and its teardown drops it (Engineering Practices, "E2E environment").
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
