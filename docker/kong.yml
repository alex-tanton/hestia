# Kong declarative config: auth and realtime only.
# There are deliberately no rest, graphql, storage, functions, analytics, or meta routes.
# $SUPABASE_ANON_KEY and $SUPABASE_SERVICE_KEY are substituted by kong-entrypoint.sh.
#
# GoTrue is an allowlist: only the calls supabase-js makes for sign-in, token refresh, sign-out and
# the session checks, plus the email-link /verify, have a route, each with its method. Everything
# else under /auth/v1 ends at the auth-v1-denied route. The paths are exact regexes (`~/...$`),
# which Kong ranks above the denied route's prefix; they need _format_version 3.0, because under
# 2.1 Kong rewrites a regex path and refuses the leading `~`.
_format_version: '3.0'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # The email links GoTrue issues (password recovery) are opened in a browser with no apikey,
  # and verifyOtp posts the magic-link code here.
  - name: auth-v1-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-verify
        strip_path: true
        methods:
          - GET
          - POST
        paths:
          - ~/auth/v1/verify/?$

  # signInWithPassword and every token refresh.
  - name: auth-v1-token
    url: http://auth:9999/token
    routes:
      - name: auth-v1-token
        strip_path: true
        methods:
          - POST
        paths:
          - ~/auth/v1/token/?$
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # signOut.
  - name: auth-v1-logout
    url: http://auth:9999/logout
    routes:
      - name: auth-v1-logout
        strip_path: true
        methods:
          - POST
        paths:
          - ~/auth/v1/logout/?$
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # The session checks setSession and the URL-fragment sign-in make. PUT /user (a password or
  # email change) is not here: only hestia-service makes it, directly on auth:9999.
  - name: auth-v1-user
    url: http://auth:9999/user
    routes:
      - name: auth-v1-user
        strip_path: true
        methods:
          - GET
        paths:
          - ~/auth/v1/user/?$
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # signInWithOtp, used only when the build enables magic link.
  - name: auth-v1-otp
    url: http://auth:9999/otp
    routes:
      - name: auth-v1-otp
        strip_path: true
        methods:
          - POST
        paths:
          - ~/auth/v1/otp/?$
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # Creating and listing users with the service-role key: the E2E seed (supabase/seed) does it
  # through the stack. The anon key is refused by the acl.
  - name: auth-v1-admin-users
    url: http://auth:9999/admin/users
    routes:
      - name: auth-v1-admin-users
        strip_path: true
        methods:
          - GET
          - POST
        paths:
          - ~/auth/v1/admin/users/?$
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  # Anything else under /auth/v1 (signup, recover, settings, admin, jwks, the rest of GoTrue's
  # surface) is refused here, before any key check, whoever asks. hestia-service reaches GoTrue
  # directly on auth:9999 and never through Kong.
  - name: auth-v1-denied
    url: http://auth:9999/
    routes:
      - name: auth-v1-denied
        strip_path: true
        paths:
          - /auth/v1
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: Access is forbidden.

  # supabase-js sends the apikey in the WebSocket URL's query string.
  - name: realtime-v1-ws
    url: http://realtime-dev.supabase-realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # Realtime's REST API (broadcast over HTTP) is open to clients; its tenant-management and
  # OpenAPI endpoints are not.
  - name: realtime-v1-rest
    url: http://realtime-dev.supabase-realtime:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: realtime-v1-rest-tenants
    url: http://realtime-dev.supabase-realtime:4000/api/tenants
    routes:
      - name: realtime-v1-rest-tenants
        strip_path: true
        paths:
          - /realtime/v1/api/tenants
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: Access is forbidden.

  - name: realtime-v1-rest-openapi
    url: http://realtime-dev.supabase-realtime:4000/api/openapi
    routes:
      - name: realtime-v1-rest-openapi
        strip_path: true
        paths:
          - /realtime/v1/api/openapi
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: Access is forbidden.
