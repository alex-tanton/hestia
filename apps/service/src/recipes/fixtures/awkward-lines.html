<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grandma's Sunday Sauce</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Grandma's Sunday Sauce",
        "recipeYield": "Serves 6-8",
        "recipeIngredient": [
          "1 (14.5 oz) can diced tomatoes, drained",
          "salt and pepper to taste",
          "2-3 cloves garlic",
          "a splash of red wine",
          "1 lb ground beef",
          "1/2 cup grated parmesan, plus more for serving"
        ],
        "recipeInstructions": "Brown the beef, add the garlic and tomatoes, and simmer for two hours, seasoning to taste."
      }
    </script>
  </head>
  <body>
    <h1>Grandma's Sunday Sauce</h1>
    <p>
      Real recipe sites are full of ingredient lines like these — parenthetical package sizes,
      ranges instead of a single count, and lines with no quantity at all. This fixture exercises
      the ingredient-line parser and its editable preview, not the JSON-LD extraction itself.
    </p>
  </body>
</html>
