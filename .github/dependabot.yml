version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories: ['/docker']
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
    # The runtime is pinned to Node 24 (.nvmrc, package.json engines, tsup target). A Node major
    # moves with those, in a deliberate change, never through a Dependabot bump.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build(docker)
